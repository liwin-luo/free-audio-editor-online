# Minimum quality gate: type-check and build on every push/PR.
# The browser-based check:* scripts need macOS Chrome + a preview server,
# so they stay manual for now (see scripts/*.mjs hardcoded Chrome paths).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
